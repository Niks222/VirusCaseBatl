<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe066" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="bevel1" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="bevel2" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="starShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#b45309" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#fef08a" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#starGlow)"/>

  <!-- Main Star Shape -->
  <polygon points="256,40 323,176 472,198 364,303 390,452 256,381 122,452 148,303 40,198 189,176" 
           fill="url(#starBody)" filter="url(#starShadow)" stroke="#fef08a" stroke-width="4"/>

  <!-- 3D Facets Light Layers -->
  <!-- Top Point Right -->
  <polygon points="256,40 256,256 323,176" fill="url(#bevel1)"/>
  <!-- Right Top Point -->
  <polygon points="472,198 256,256 323,176" fill="url(#bevel2)"/>
  <!-- Right Bottom Point -->
  <polygon points="472,198 256,256 364,303" fill="url(#bevel1)"/>
  <!-- Bottom Right Point -->
  <polygon points="390,452 256,256 364,303" fill="url(#bevel2)"/>
  <!-- Bottom Point Center Right -->
  <polygon points="390,452 256,256 256,381" fill="url(#bevel1)"/>
  <!-- Bottom Point Center Left -->
  <polygon points="122,452 256,256 256,381" fill="url(#bevel2)"/>
  <!-- Bottom Left Point -->
  <polygon points="122,452 256,256 148,303" fill="url(#bevel1)"/>
  <!-- Left Bottom Point -->
  <polygon points="40,198 256,256 148,303" fill="url(#bevel2)"/>
  <!-- Left Top Point -->
  <polygon points="40,198 256,256 189,176" fill="url(#bevel1)"/>
  <!-- Top Point Left -->
  <polygon points="256,40 256,256 189,176" fill="url(#bevel2)"/>

  <!-- Inner Sparkle Highlight -->
  <circle cx="256" cy="256" r="14" fill="#ffffff" opacity="0.9"/>
  <polygon points="256,230 262,256 282,256 266,266 272,286 256,274 240,286 246,266 230,256 250,256" fill="#ffffff"/>
</svg>
